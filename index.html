<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhyEd — Links</title>
  <link rel="stylesheet" href="glass.css">
  <style>
    /* ── EDIT THIS to update links ── */

    /* ── Layout ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: #080810;
      overflow-x: hidden;
    }

    /* ── Animated background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: drift 18s ease-in-out infinite alternate;
      opacity: 0.55;
    }
    .blob-1 { width: 500px; height: 500px; background: #5b21e6; top: -100px; left: -120px; animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; background: #0ea5e9; top: 30%; right: -80px; animation-delay: -6s; }
    .blob-3 { width: 350px; height: 350px; background: #f43f5e; bottom: -80px; left: 30%; animation-delay: -12s; }
    .blob-4 { width: 280px; height: 280px; background: #10b981; bottom: 20%; left: -60px; animation-delay: -4s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(40px, 30px) scale(1.08); }
      100% { transform: translate(-20px, 50px) scale(0.95); }
    }

    /* ── Main layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 24px 80px;
    }

    /* ── Glass card override ── */
    #card.glass-container {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 0;
      padding: 0;
      width: 420px;
      max-width: 100%;
    }

    /* ── Card inner content ── */
    .card-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 32px 32px;
      position: relative;
      z-index: 1;
    }

    /* ── Avatar ── */
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #3b82f6, #f43f5e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: white;
      margin-bottom: 14px;
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.4);
      flex-shrink: 0;
    }

    .name {
      font-size: 22px;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .handle {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .bio {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      line-height: 1.5;
    }

    /* ── Links section ── */
    .links-section {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0 16px 24px;
      position: relative;
      z-index: 1;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 0 16px 20px;
      position: relative;
      z-index: 1;
    }

    /* ── "LATEST" section label ── */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      padding: 0 16px 10px;
      position: relative;
      z-index: 1;
    }

    /* ── Individual link row ── */
    .link-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: background 0.18s;
      position: relative;
    }
    .link-row:hover { background: rgba(255,255,255,0.07); }
    .link-row:active { background: rgba(255,255,255,0.12); }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .link-info { flex: 1; min-width: 0; }

    .link-name {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.92);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .link-desc {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-new {
      background: rgba(232,255,59,0.18);
      color: #e8ff3b;
      border: 1px solid rgba(232,255,59,0.35);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .link-arrow {
      font-size: 14px;
      color: rgba(255,255,255,0.25);
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.3px;
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      #card.glass-container { width: 100%; }
      .page { padding: 40px 16px 60px; }
    }
  </style>
</head>
<body>

<!-- Animated background blobs -->
<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>

<main class="page">
  <!-- Glass card injected by JS -->
  <div id="glass-mount"></div>

  <p class="footer">@officialwhyed</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="container.js"></script>
<script>
  /* ═══════════════════════════════════════════════
     EDIT HERE to update links
     isNew: true  → shows "NEW" badge + placed at top
     Set url: '#' for unreleased projects
  ═══════════════════════════════════════════════ */
  const PROFILE = {
    name: 'WhyEd',
    handle: '@officialwhyed',
    bio: 'Builder · Music · Code',
    initials: 'WE',
  }

  const LINKS = [
    {
      name: 'WhyLocalLM su YouTube',
      desc: 'AI da 35 miliardi sul mio PC, in 2 minuti',
      icon: '\u25B6',
      iconBg: 'linear-gradient(135deg,#0ea5e9,#0284c7)',
      url: 'https://www.youtube.com/watch?v=6wquzlKzD4o',
      isNew: true,
    },
    {
      name: 'WhyChat',
      desc: 'AI chat, built different',
      icon: '💬',
      iconBg: 'linear-gradient(135deg,#7c3aed,#4f46e5)',
      url: '#',
      isNew: true,
    },
    {
      name: 'WavesCheck',
      desc: '233 Waves plugins, searchable',
      icon: '🎛',
      iconBg: 'linear-gradient(135deg,#0ea5e9,#0284c7)',
      url: 'https://officialwhyed.github.io/wavescheck/',
      isNew: true,
    },
    {
      name: 'Portfolio',
      desc: 'Work, music, tools',
      icon: '⚡',
      iconBg: 'linear-gradient(135deg,#f59e0b,#d97706)',
      url: '#',
      isNew: false,
    },
    {
      name: 'WhyPost',
      desc: 'Content automation',
      icon: '📮',
      iconBg: 'linear-gradient(135deg,#10b981,#059669)',
      url: '#',
      isNew: false,
    },
    {
      name: 'WhyCalendar',
      desc: 'AI personal assistant',
      icon: '🗓',
      iconBg: 'linear-gradient(135deg,#f43f5e,#e11d48)',
      url: '#',
      isNew: false,
    },
    {
      name: 'WhyCremisi',
      desc: 'AI VST plugin',
      icon: '🎹',
      iconBg: 'linear-gradient(135deg,#8b5cf6,#7c3aed)',
      url: '#',
      isNew: false,
    },
  ]
  /* ═══════════════════════════════════════════════ */

  function buildCardHTML() {
    const newLinks = LINKS.filter(l => l.isNew)
    const oldLinks = LINKS.filter(l => !l.isNew)

    const renderLink = l => `
      <a class="link-row" href="${l.url}" target="_blank" rel="noopener">
        <div class="link-icon" style="background:${l.iconBg}">${l.icon}</div>
        <div class="link-info">
          <div class="link-name">
            ${l.name}
            ${l.isNew ? '<span class="badge-new">New</span>' : ''}
          </div>
          <div class="link-desc">${l.desc}</div>
        </div>
        <div class="link-arrow">↗</div>
      </a>`

    return `
      <div class="card-inner">
        <div class="avatar">${PROFILE.initials}</div>
        <div class="name">${PROFILE.name}</div>
        <div class="handle">${PROFILE.handle}</div>
        <div class="bio">${PROFILE.bio}</div>
      </div>
      <div class="divider"></div>
      ${newLinks.length ? `<div class="section-label">Latest</div>` : ''}
      <div class="links-section">
        ${newLinks.map(renderLink).join('')}
      </div>
      ${oldLinks.length && newLinks.length ? `<div class="divider" style="margin-bottom:16px"></div>` : ''}
      <div class="links-section" style="padding-top:0">
        ${oldLinks.map(renderLink).join('')}
      </div>
    `
  }

  // Build glass card
  const card = new Container({
    borderRadius: 24,
    type: 'rounded',
    tintOpacity: 0.18,
  })

  card.element.id = 'card'
  card.element.insertAdjacentHTML('beforeend', buildCardHTML())

  document.getElementById('glass-mount').appendChild(card.element)
</script>
</body>
</html>
